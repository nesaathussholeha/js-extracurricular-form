<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Ekstrakurikuler</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">
        
        <div id="alertBox" class="alert-card" style="display: none;"></div>
        
        <div class="card">
            <h2>Formulir Pendaftaran Ekstrakurikuler</h2>

            <form id="formPendaftaran" action="#" method="POST" novalidate>
                <table cellpadding="6" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td width="35%"><label for="nama">Nama Lengkap</label></td>
                        <td width="5%">:</td>
                        <td width="60%"><input type="text" id="nama" name="nama" required placeholder="Masukkan Nama Lengkap"></td>
                    </tr>
                    <tr>
                        <td><label for="nis">NIS</label></td>
                        <td>:</td>
                        <td><input type="text" id="nis" name="nis" required placeholder="Masukkan NISN"></td>
                    </tr>
                    <tr>
                        <td><label for="kelas">Kelas</label></td>
                        <td>:</td>
                        <td><input type="text" id="kelas" name="kelas" required placeholder="Masukkan Kelas"></td>
                    </tr>
                    <tr>
                        <td><label for="tgl_lahir">Tanggal Lahir</label></td>
                        <td>:</td>
                        <td><input type="date" id="tgl_lahir" name="tgl_lahir" required></td>
                    </tr>
                    <tr>
                        <td>Jenis Kelamin</td>
                        <td>:</td>
                        <td>
                            <input type="radio" id="jk_l" name="jk" value="Laki-laki" required>
                            <label for="jk_l">Laki-laki</label>&nbsp;&nbsp;
                            <input type="radio" id="jk_p" name="jk" value="Perempuan">
                            <label for="jk_p">Perempuan</label>
                        </td>
                    </tr>
                    <tr>
                        <td valign="top">Pilihan Ekstrakurikuler</td>
                        <td valign="top">:</td>
                        <td>
                            <input type="checkbox" id="pramuka" name="ekskul" value="Pramuka">
                            <label for="pramuka">Pramuka</label><br>

                            <input type="checkbox" id="pmr" name="ekskul" value="PMR">
                            <label for="pmr">PMR</label><br>

                            <input type="checkbox" id="kir" name="ekskul" value="KIR">
                            <label for="kir">KIR</label><br>

                            <input type="checkbox" id="paskibra" name="ekskul" value="Paskibra">
                            <label for="paskibra">Paskibra</label><br>

                            <input type="checkbox" id="tari" name="ekskul" value="Seni Tari">
                            <label for="tari">Seni Tari</label><br>

                            <input type="checkbox" id="musik" name="ekskul" value="Musik">
                            <label for="musik">Musik</label><br>

                            <input type="checkbox" id="lainnya" name="ekskul" value="Lainnya">
                            <label for="lainnya">Lain-lain</label>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="email">Alamat Email</label></td>
                        <td>:</td>
                        <td><input type="email" id="email" name="email" placeholder="Masukkan alamat email"></td>
                    </tr>
                    <tr>
                        <td><label for="telepon">Nomor Telepon</label></td>
                        <td>:</td>
                        <td><input type="number" id="telepon" name="telepon" placeholder="Masukkan no.telp"></td>
                    </tr>
                    <tr>
                        <td colspan="3" class="btn-group">
                            <input type="submit" value="Kirim Data">
                            <input type="reset" value="Reset Formulir">
                        </td>
                    </tr>
                </table>
            </form>
        </div>

        <div id="areaKartu" class="card" style="margin-top: 25px; display: none;">
            <h2 style="border-bottom: 2px solid #000; padding-bottom: 10px;">Kartu Anggota Terdaftar</h2>
            <div id="containerKartu"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
